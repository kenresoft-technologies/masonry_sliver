version: 0.1.0
publish_to: none
homepage: https://github.com/kenresoft-technologies/masonry_sliver
repository: https://github.com/kenresoft-technologies/masonry_sliver
issue_tracker: https://github.com/kenresoft-technologies/masonry_sliver/issues
topics:
  - sliver
  - masonry
  - staggered-grid
  - scrolling

environment:
  sdk: ^3.5.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
